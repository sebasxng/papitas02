<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresa de BMO 🌻</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Escenario estilo Minecraft */
        .stage {
            position: relative;
            width: 100%;
            max-width: 850px;
            height: 480px;
            /* Fondo de cielo nublado / oscuro estilo Minecraft */
            background: #1e293b url('https://i.imgur.com/3Z8X4qB.png') center/cover no-repeat;
            border: 4px solid #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* Suelo / Camino de tierra-piedra Minecraft */
        .minecraft-road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background-color: #475569;
            border-top: 6px solid #1e293b;
            box-shadow: inset 0 10px 0 #334155;
        }

        /* Contenedor de BMO */
        .bmo-character {
            position: absolute;
            bottom: 45px;
            left: -180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: left 4s linear;
            z-index: 10;
        }

        /* Sprite o Imagen Pixel Art de BMO */
        .bmo-img {
            width: 130px;
            height: auto;
            image-rendering: pixelated;
            cursor: pointer;
            filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.5));
        }

        /* Globo de texto Minecraft */
        .speech-bubble {
            position: absolute;
            top: -70px;
            background-color: #ffffff;
            border: 4px solid #000000;
            padding: 10px 12px;
            font-size: 8px;
            line-height: 1.6;
            color: #000000;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 4px 4px 0px #000000;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #000 transparent;
            display: block;
            width: 0;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ramo de flores amarillas estilo Minecraft */
        .yellow-flowers {
            position: absolute;
            bottom: 10px;
            right: -20px;
            width: 45px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            image-rendering: pixelated;
        }

        .yellow-flowers.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Ventana Modal / Carta Minecraft */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .letter-card {
            background-color: #fef08a;
            border: 4px solid #ca8a04;
            box-shadow: 0px 8px 0px #854d0e;
            width: 90%;
            max-width: 460px;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            color: #713f12;
        }

        .letter-card h2 {
            font-size: 10px;
            margin-bottom: 15px;
            color: #854d0e;
        }

        .letter-card p {
            font-size: 8px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: left;
            white-space: pre-wrap;
        }

        .close-btn {
            background-color: #ca8a04;
            color: #fff;
            border: none;
            padding: 10px 14px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #713f12;
        }

        .close-btn:active {
            transform: translateY(2px);
            box-shadow: 0px 2px 0px #713f12;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="minecraft-road"></div>

        <div class="bmo-character" id="bmoCharacter">
            <div class="speech-bubble" id="speechBubble">...</div>

            <img src="bmo_skate.png" alt="BMO en patineta" class="bmo-img" id="bmoImg">

            <img src="flores_amarillas.png" alt="Flores Amarillas Minecraft" class="yellow-flowers" id="flowers">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="letter-card">
            <h2>🌻 ¡UN REGALO DE BMO! 🌻</h2>
            <p id="letterContent">
Página 1:
¡Hola! BMO venía en su patineta y se detuvo exclusivamente al verte para darte estas flores amarillas.

¡Espero que te guste mucho este pequeño detalle! ❤
            </p>
            <button class="close-btn" id="closeModal">CERRAR 🌻</button>
        </div>
    </div>

    <script>
        const bmoCharacter = document.getElementById('bmoCharacter');
        const speechBubble = document.getElementById('speechBubble');
        const flowers = document.getElementById('flowers');
        const modal = document.getElementById('modal');
        const closeModal = document.getElementById('closeModal');
        const bmoImg = document.getElementById('bmoImg');

        // Secuencia de animación e interacción
        
        // 1. BMO entra manejando en patineta hasta el centro
        setTimeout(() => {
            bmoCharacter.style.left = 'calc(50% - 65px)';
        }, 300);

        // 2. Se detiene y mira hacia la pantalla (puedes cambiar la imagen si tienes el frame de frente)
        setTimeout(() => {
            // Si tienes una imagen de BMO mirando de frente la cambias aquí:
            // bmoImg.src = "bmo_frente.png";
            
            speechBubble.textContent = "Oh hola, ¡eres tú! :D";
            speechBubble.classList.add('active');
        }, 4400);

        // 3. Saca las flores amarillas de su bolso
        setTimeout(() => {
            speechBubble.textContent = "Mira lo que tengo para ti 🌻";
            flowers.classList.add('visible');
        }, 7000);

        // Abrir la carta al dar clic en las flores o en BMO
        flowers.addEventListener('click', openLetter);
        bmoImg.addEventListener('click', openLetter);

        function openLetter() {
            if (flowers.classList.contains('visible')) {
                modal.classList.add('active');
            }
        }

        // Cerrar modal
        closeModal.addEventListener('click', () => {
            modal.classList.remove('active');
        });
    </script>
</body>
</html>
